<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-labelledby="if-title if-desc" preserveAspectRatio="xMidYMid meet">
  <title id="if-title">Footer — Isfaque Ansari</title>
  <desc id="if-desc">Minimal burgundy rule with a travelling highlight and the words thanks for reading.</desc>

  <defs>
    <linearGradient id="if-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="if-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#701A3D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="if-spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Motion only. Colour and type are presentation attributes, so a renderer
         that drops this block still shows the finished rule. -->
    <style><![CDATA[
      .if-run { animation: if-travel 7s cubic-bezier(.6,0,.4,1) infinite; }
      .if-dot { animation: if-blink 7s ease-in-out infinite; }

      @keyframes if-travel {
        0%   { transform: translateX(-200px); opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateX(900px); opacity: 0; }
      }
      @keyframes if-blink {
        0%, 42%  { opacity: 0.25; }
        50%      { opacity: 1; }
        58%,100% { opacity: 0.25; }
      }

      @media (prefers-reduced-motion: reduce) {
        .if-run { animation: none; opacity: 0; }
        .if-dot { animation: none; }
      }
    ]]></style>
  </defs>

  <rect width="900" height="96" rx="14" fill="url(#if-base)"/>
  <rect x="60" y="30" width="780" height="1" fill="url(#if-hair)"/>

  <g class="if-run" opacity="0">
    <rect x="0" y="28.6" width="150" height="3.8" rx="1.9" fill="url(#if-spark)"/>
  </g>

  <text x="60" y="62" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="4.2" fill="#C77B9B">THANKS FOR READING</text>
  <circle class="if-dot" cx="450" cy="58" r="2.4" fill="#E5B5C7" opacity="0.7"/>
  <text x="840" y="62" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4.2" fill="#E5B5C7">ISFAQUE ANSARI</text>
</svg>
