name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-burgundy.svg?color_snake=#451126&color_dots=#F8F0F3,#E5B5C7,#C77B9B,#701A3D,#451126
            dist/github-snake-burgundy-dark.svg?color_snake=#E5B5C7&color_dots=#190B12,#451126,#701A3D,#C77B9B,#E5B5C7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
